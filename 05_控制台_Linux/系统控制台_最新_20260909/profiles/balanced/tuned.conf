# profiles/balanced/tuned.conf — 基础平衡档（其他场景的默认继承基）
# 2026-09-02 Phase 2 G1 实施: 把硬编码 SCENES 表迁为 INI 配置

[main]
summary=Balanced — 通用平衡档（其他场景的基类）
version=1

[cpu]
# 默认调度器 + EPP + 功耗 + turbo
governor=powersave
energy_performance_preference=balance_performance
pl1_watts=15
turbo=1
# intel_pstate 特殊参数
hwp_dynamic_boost=1
epb=balance_performance

[gpu]
# intel/nvidia 模式：保持当前 prime-select 设置
mode=auto
rc6_enable=1

[battery]
# 默认无充电阈值（需要 vendor 支持）
charge_threshold=100

[thermal]
# 默认温度守护阈值
high_temp=85000
low_temp=75000
down_pl1=15
