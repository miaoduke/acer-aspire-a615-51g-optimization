name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# 目录与依赖说明（2026-09-13 审计 run#1 修复）:
# - 控制台位于嵌套目录, 所有 job 用 defaults.run.working-directory 定位
#   （run#1 的 lint job 已验证该写法可用）
# - 不启用 setup-python 的 cache:'pip' — 仓库无 requirements.txt,
#   缓存键计算会立即失败（run#1 三 matrix 全部倒在此步）
# - gi(PyGObject) 无 wheel, apt 的 python3-gi 只对系统 Python 生效,
#   setup-python 的解释器装不上 → GUI 测试走独立 job 用系统 python3

jobs:
  test:
    # 纯 Python 测试（无 GTK/gi 依赖）: profile/plugin/i18n/controller/config
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 05_控制台_Linux/系统控制台_最新_20260909
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml pytest

    - name: Run profile tests
      run: python3 tests/test_phase2_profile.py

    - name: Run integration tests
      run: python3 tests/test_phase2_integration.py

    - name: Run plugin tests
      run: python3 tests/test_phase2_plugin.py

    - name: Run complete tests
      run: python3 tests/test_phase2_complete.py

    - name: Run i18n tests
      run: |
        python3 tests/test_p1_i18n_apply.py
        python3 tests/test_p2_i18n.py

    - name: Run shellcheck (if available)
      run: |
        if command -v shellcheck >/dev/null 2>&1; then
          shellcheck backend/*.sh scripts/*.sh
        else
          echo "shellcheck not installed, skipping"
        fi

    - name: Run safeguard regression tests (P0-1/P1-1)
      run: bash tests/test_p1_safeguard.sh

    - name: Validate install.sh syntax
      run: bash -n install.sh

  test-gui:
    # GUI 测试（需要 gi/PyGObject + Xvfb）: 用系统 Python（python3-gi 只装给它）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 05_控制台_Linux/系统控制台_最新_20260909

    steps:
    - uses: actions/checkout@v4

    - name: Install GTK + PyGObject (system python)
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-0 gir1.2-gtk-3.0 python3-gi xvfb

    - name: Run GUI logic tests
      run: python3 tests/test_phase2_gui.py

    - name: Run GUI render tests (Xvfb)
      run: xvfb-run -a python3 tests/test_phase2_gui_render.py

    - name: Run user-view e2e tests
      run: python3 tests/test_e2e_user_view.py

    - name: Run perf-pipeline e2e tests
      run: python3 tests/test_e2e_perf_pipeline.py

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 05_控制台_Linux/系统控制台_最新_20260909
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Check for double-sudo
      run: python3 scripts/check_double_sudo.py .

    - name: Validate all profiles
      run: |
        for p in ac-perf ac-bal ac-quiet bat-save bat-bal bat-perf balanced user_custom; do
          python3 src/core/profile.py --validate "$p" || exit 1
        done

    - name: List all plugins
      run: python3 src/core/plugin.py --list
